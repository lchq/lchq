<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>运费报价查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #e8f0fe 0%, #f5f5f5 100%);
    padding: 16px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 560px; margin: 0 auto; }

  /* 顶部品牌区 */
  .header {
    text-align: center;
    margin: 20px 0 28px;
  }
  .header .logo {
    font-size: 40px;
    margin-bottom: 8px;
  }
  .header h1 {
    color: #1a1a1a;
    font-size: 22px;
    font-weight: 700;
  }
  .header p {
    color: #999;
    font-size: 13px;
    margin-top: 6px;
  }

  /* 搜索框 */
  .search-box { position: relative; margin-bottom: 20px; }
  .search-box .icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    color: #bbb;
    pointer-events: none;
  }
  .search-box input {
    width: 100%;
    padding: 15px 16px 15px 46px;
    font-size: 16px;
    border: 2px solid #e0e4ea;
    border-radius: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    background: #fff;
    -webkit-appearance: none;
  }
  .search-box input:focus {
    border-color: #1677ff;
    box-shadow: 0 0 0 3px rgba(22,119,255,.12);
  }
  .search-box input::placeholder { color: #c0c0c0; }

  /* 下拉提示 */
  .dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    max-height: 240px;
    overflow-y: auto;
    display: none;
    z-index: 100;
  }
  .dropdown div {
    padding: 13px 18px;
    cursor: pointer;
    font-size: 15px;
    color: #333;
    border-bottom: 1px solid #f5f5f5;
    transition: background .15s;
  }
  .dropdown div:last-child { border-bottom: none; }
  .dropdown div:hover, .dropdown div.active { background: #e6f4ff; color: #1677ff; }

  /* 结果卡片 */
  .card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
    display: none;
    animation: slideUp .3s ease;
  }
  .card.show { display: block; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card-header {
    background: linear-gradient(135deg, #1677ff, #4096ff);
    color: #fff;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-header .pin { font-size: 22px; }
  .card-header .title-text { font-size: 18px; font-weight: 600; }
  .card-header .sub { font-size: 12px; opacity: .8; margin-top: 2px; }

  .card-body { padding: 6px 0; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 22px;
    border-bottom: 1px solid #f5f5f5;
    transition: background .15s;
  }
  .row:last-child { border-bottom: none; }
  .row:active { background: #fafafa; }
  .row .left { display: flex; flex-direction: column; gap: 4px; }
  .row .type {
    color: #333;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row .type .badge {
    font-size: 11px;
    background: #f0f5ff;
    color: #1677ff;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 400;
  }
  .row .detail { color: #999; font-size: 13px; }
  .row .price-block { text-align: right; }
  .row .price {
    color: #f5222d;
    font-size: 20px;
    font-weight: 700;
  }
  .row .price small {
    font-size: 12px;
    font-weight: 400;
    color: #f5222d;
  }
  .row .unit { color: #bbb; font-size: 12px; margin-top: 2px; }

  /* 空状态 */
  .empty {
    text-align: center;
    color: #bbb;
    padding: 48px 20px;
    display: none;
  }
  .empty.show { display: block; }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }

  /* 底部提示 */
  .footer {
    text-align: center;
    color: #ccc;
    font-size: 12px;
    margin-top: 40px;
  }

  /* 加载动画 */
  .loading {
    text-align: center;
    padding: 40px;
    color: #999;
    display: none;
  }
  .loading.show { display: block; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #e8e8e8;
    border-top-color: #1677ff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">🚛</div>
    <h1>运费报价查询</h1>
    <p>输入目的地，秒查各车型报价</p>
  </div>

  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="请输入目的地，如：北京" autocomplete="off">
    <div class="dropdown" id="dropdown"></div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>加载中...</p>
  </div>

  <div class="card" id="card">
    <div class="card-header">
      <span class="pin">📍</span>
      <div>
        <div class="title-text" id="cardTitle"></div>
        <div class="sub" id="cardSub"></div>
      </div>
    </div>
    <div class="card-body" id="cardBody"></div>
  </div>

  <div class="empty" id="empty">
    <div class="icon">🤔</div>
    <p>未找到该目的地的报价<br>请检查输入是否正确</p>
  </div>

  <div class="empty" id="hint">
    <div class="icon">💡</div>
    <p>输入省市名称开始查询<br>支持模糊搜索，如"新疆""内蒙古"</p>
  </div>

  <div class="footer">数据仅供参考，最终价格以实际确认为准</div>
</div>

<script>
/* ========== 价格数据（后台改这里就行） ========== */
const PRICES = {
  "北京": {
    "整车":   { "价格": 13496, "吨位": 225 },
    "敞顶箱": { "价格": 14882.6, "吨位": 241 },
    "顶开门": { "价格": 14843.6, "吨位": 244 }
  },
  "上海": {
    "整车":   { "价格": 12800, "吨位": 210 },
    "敞顶箱": { "价格": 14000, "吨位": 230 },
    "顶开门": { "价格": 13950, "吨位": 232 }
  },
  "广东": {
    "整车":   { "价格": 9800, "吨位": 180 },
    "敞顶箱": { "价格": 11200, "吨位": 200 },
    "顶开门": { "价格": 11150, "吨位": 202 }
  },
  "浙江": {
    "整车":   { "价格": 10500, "吨位": 195 },
    "敞顶箱": { "价格": 11800, "吨位": 215 },
    "顶开门": { "价格": 11750, "吨位": 218 }
  },
  "江苏": {
    "整车":   { "价格": 10200, "吨位": 190 },
    "敞顶箱": { "价格": 11500, "吨位": 210 },
    "顶开门": { "价格": 11480, "吨位": 212 }
  },
  "四川": {
    "整车":   { "价格": 12500, "吨位": 215 },
    "敞顶箱": { "价格": 13800, "吨位": 235 },
    "顶开门": { "价格": 13750, "吨位": 238 }
  },
  "新疆": {
    "整车":   { "价格": 18500, "吨位": 260 },
    "敞顶箱": { "价格": 19800, "吨位": 275 },
    "顶开门": { "价格": 19750, "吨位": 278 }
  },
  "西藏": {
    "整车":   { "价格": 20500, "吨位": 280 },
    "敞顶箱": { "价格": 21800, "吨位": 295 },
    "顶开门": { "价格": 21750, "吨位": 298 }
  },
  "内蒙古": {
    "整车":   { "价格": 16800, "吨位": 245 },
    "敞顶箱": { "价格": 18000, "吨位": 260 },
    "顶开门": { "价格": 17950, "吨位": 262 }
  },
  "黑龙江": {
    "整车":   { "价格": 15800, "吨位": 235 },
    "敞顶箱": { "价格": 17000, "吨位": 250 },
    "顶开门": { "价格": 16950, "吨位": 252 }
  }
};
/* ============================================== */

const input      = document.getElementById('searchInput');
const dropdown   = document.getElementById('dropdown');
const card       = document.getElementById('card');
const cardTitle  = document.getElementById('cardTitle');
const cardSub    = document.getElementById('cardSub');
const cardBody   = document.getElementById('cardBody');
const empty      = document.getElementById('empty');
const hint       = document.getElementById('hint');
const loading    = document.getElementById('loading');

const allKeys = Object.keys(PRICES);
hint.classList.add('show');

// 数字格式化
function fmt(n) {
  return Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
}

// 渲染结果卡片
function showResult(key) {
  const data = PRICES[key];
  if (!data) {
    card.classList.remove('show');
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');

  // 计算每吨单价用于展示
  let minUnit = Infinity, minType = '';
  Object.keys(data).forEach(type => {
    const item = data[type];
    const unit = item['价格'] / item['吨位'];
    if (unit < minUnit) { minUnit = unit; minType = type; }
  });

  cardTitle.textContent = key + ' 运费报价';
  cardSub.textContent = '共 ' + Object.keys(data).length + ' 种车型可选';

  cardBody.innerHTML = Object.keys(data).map(type => {
    const item = data[type];
    const unitPrice = fmt((item['价格'] / item['吨位']).toFixed(2));
    const isBest = type === minType;
    return `
      <div class="row">
        <div class="left">
          <div class="type">${type} ${isBest ? '<span class="badge">单价最低</span>' : ''}</div>
          <div class="detail">吨位：${fmt(item['吨位'])} 吨</div>
        </div>
        <div class="price-block">
          <div class="price"><small>¥</small>${fmt(item['价格'])}</div>
          <div class="unit">≈ ¥${unitPrice}/吨</div>
        </div>
      </div>`;
  }).join('');

  card.classList.add('show');
}

// 输入搜索
input.addEventListener('input', function() {
  const val = this.value.trim();
  card.classList.remove('show');
  empty.classList.remove('show');

  if (!val) { dropdown.style.display = 'none'; hint.classList.add('show'); return; }
  hint.classList.remove('show');

  const matches = allKeys.filter(k => k.includes(val));
  if (matches.length === 0) {
    dropdown.style.display = 'none';
    empty.classList.add('show');
    return;
  }

  dropdown.innerHTML = matches.map((k, i) =>
    `<div data-key="${k}" ${i === 0 ? 'class="active"' : ''}>${k}</div>`
  ).join('');
  dropdown.style.display = 'block';
});

// 键盘上下选择 + 回车确认
let activeIdx = 0;
input.addEventListener('keydown', function(e) {
  const items = dropdown.querySelectorAll('div');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    items[activeIdx]?.classList.remove('active');
    activeIdx = (activeIdx + 1) % items.length;
    items[activeIdx]?.classList.add('active');
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    items[activeIdx]?.classList.remove('active');
    activeIdx = (activeIdx - 1 + items.length) % items.length;
    items[activeIdx]?.classList.add('active');
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const key = items[activeIdx]?.dataset.key;
    if (key) { input.value = key; dropdown.style.display = 'none'; showResult(key); }
  } else if (e.key === 'Escape') {
    dropdown.style.display = 'none';
  }
});

// 点击下拉项
dropdown.addEventListener('click', function(e) {
  if (e.target.tagName === 'DIV') {
    const key = e.target.dataset.key;
    input.value = key;
    dropdown.style.display = 'none';
    showResult(key);
  }
});

// 点别处关闭下拉
document.addEventListener('click', e => {
  if (!e.target.closest('.search-box')) dropdown.style.display = 'none';
});

// 清除按钮（输入时显示 X）
input.addEventListener('input', function() {
  // 可扩展：加清除按钮
});
</script>
</body>
</html>
