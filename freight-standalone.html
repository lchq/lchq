<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运费报价查询</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; padding: 16px; min-height: 100vh; }
.container { max-width: 540px; margin: 0 auto; }
h1 { text-align: center; color: #1a1a1a; margin: 16px 0 8px; font-size: 22px; }
.subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
.search-box { position: relative; margin-bottom: 20px; }
.search-box input { width: 100%; padding: 14px 18px; font-size: 16px; border: 2px solid #d9d9d9; border-radius: 12px; outline: none; transition: border-color .2s; background: #fff; }
.search-box input:focus { border-color: #1677ff; }
.dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border-radius: 0 0 12px 12px; box-shadow: 0 6px 16px rgba(0,0,0,.12); max-height: 220px; overflow-y: auto; display: none; z-index: 10; }
.dropdown div { padding: 12px 18px; cursor: pointer; font-size: 15px; }
.dropdown div:hover { background: #e6f4ff; color: #1677ff; }

.card { background: #fff; border-radius: 14px; padding: 0; box-shadow: 0 2px 10px rgba(0,0,0,.06); display: none; overflow: hidden; margin-bottom: 16px; }
.card.show { display: block; }
.card-header { background: linear-gradient(135deg, #1677ff, #4096ff); color: #fff; padding: 16px 20px; font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.card-header .badge { background: rgba(255,255,255,.25); padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 400; }
.card-body { padding: 8px 0; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #f5f5f5; }
.row:last-child { border-bottom: none; }
.row .type { color: #333; font-size: 15px; font-weight: 500; }
.row .price { color: #f5222d; font-size: 18px; font-weight: 700; }
.row .detail { color: #999; font-size: 13px; margin-top: 4px; }
.row.best { background: #fffbe6; }
.row.best .type::after { content: " ⭐最划算"; color: #faad14; font-size: 12px; }

.share-bar { display: flex; gap: 10px; margin-top: 8px; }
.share-bar button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .2s; }
.btn-copy { background: #e6f4ff; color: #1677ff; }
.btn-copy:hover { background: #bae0ff; }
.btn-qrcode { background: #f0f5ff; color: #2f54eb; }
.btn-qrcode:hover { background: #d6e4ff; }
.btn-wechat { background: #f6ffed; color: #52c41a; }
.btn-wechat:hover { background: #d9f7be; }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; text-align: center; max-height: 85vh; overflow-y: auto; }
.modal h3 { margin-bottom: 16px; color: #333; }
.modal input { width: 100%; padding: 12px 14px; font-size: 15px; border: 2px solid #d9d9d9; border-radius: 10px; outline: none; margin-bottom: 12px; }
.modal input:focus { border-color: #1677ff; }
.modal .btn-group { display: flex; gap: 10px; }
.modal .btn-group button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.modal .btn-confirm { background: #1677ff; color: #fff; }
.modal .btn-cancel { background: #f5f5f5; color: #666; }
#qrcodeImg { width: 200px; height: 200px; margin: 0 auto 12px; display: block; border: 1px solid #f0f0f0; border-radius: 8px; }

.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.75); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 200; display: none; }
.toast.show { display: block; }

.hint { text-align: center; color: #bbb; margin-top: 48px; font-size: 14px; }
.footer { text-align: center; color: #ccc; font-size: 12px; margin-top: 32px; }
.admin-entry { position: fixed; bottom: 12px; right: 12px; font-size: 11px; color: #ddd; cursor: pointer; user-select: none; }
</style>
</head>
<body>
<div class="container" id="mainContainer">
  <h1>🚂 运费报价查询</h1>
  <p class="subtitle">输入目的地，秒查各车型报价</p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 输入省市名称，如：北京" autocomplete="off">
    <div class="dropdown" id="dropdown"></div>
  </div>

  <div class="card" id="card">
    <div class="card-header">
      <span id="cardTitle"></span>
      <span class="badge" id="cardBadge"></span>
    </div>
    <div class="card-body" id="cardBody"></div>
    <div style="padding: 12px 20px; background: #fafafa;">
      <div class="share-bar">
        <button class="btn-copy" onclick="copyLink()">📋 复制链接</button>
        <button class="btn-qrcode" onclick="showQR()">🔗 二维码</button>
        <button class="btn-wechat" onclick="shareWechat()">💬 微信转发</button>
      </div>
    </div>
  </div>

  <p class="hint" id="hint">输入省市名称开始查询<br>支持模糊搜索，如"新疆""内蒙古"</p>
  <p class="footer">数据仅供参考，最终价格以实际确认为准</p>
</div>

<!-- 密码弹窗 -->
<div class="modal-overlay" id="pwdModal">
  <div class="modal">
    <h3>🔐 管理端登录</h3>
    <input type="password" id="pwdInput" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="btn-group">
      <button class="btn-cancel" onclick="closePwd()">取消</button>
      <button class="btn-confirm" onclick="doLogin()">登录</button>
    </div>
  </div>
</div>

<!-- 二维码弹窗 -->
<div class="modal-overlay" id="qrModal">
  <div class="modal">
    <h3>📱 扫码查价</h3>
    <img id="qrcodeImg" src="" alt="二维码加载中...">
    <p style="color:#999;font-size:13px;margin-bottom:12px;">客户扫码直接进入查价页</p>
    <button class="btn-cancel" style="width:100%;padding:10px;" onclick="closeQR()">关闭</button>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal" style="text-align:left;">
    <h3 id="editTitle" style="margin-bottom:16px;">新增省市</h3>
    <div style="margin-bottom:12px;">
      <label style="display:block;color:#666;font-size:13px;margin-bottom:4px;">省市名称</label>
      <input type="text" id="editCity" placeholder="如：北京">
    </div>
    <div id="editTypes"></div>
    <button onclick="addTypeRow()" style="padding:8px 16px;background:#f0f0f0;color:#333;border:none;border-radius:6px;font-size:13px;cursor:pointer;margin-bottom:16px;width:100%;">＋ 添加车型</button>
    <div class="btn-group">
      <button class="btn-cancel" onclick="closeEdit()">取消</button>
      <button class="btn-confirm" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 管理端入口 -->
<div class="admin-entry" id="adminEntry" title="连续点击5次进入管理端">v3.0</div>

<script>
// ========== 配置 ==========
const ADMIN_PASSWORD = "admin123";

// ========== 默认数据 ==========
const DEFAULT_DATA = {
  "北京": {
    "整车":   { "价格": 13496, "吨位": 225 },
    "敞顶箱": { "价格": 14882.6, "吨位": 241 },
      },
  "上海": {
    "整车":   { "价格": 12800, "吨位": 210 },
    "敞顶箱": { "价格": 14000, "吨位": 230 },
    },
  "广东": {
    "整车":   { "价格": 9800, "吨位": 180 },
    "敞顶箱": { "价格": 11200, "吨位": 200 },
     },
  "新疆": {
    "整车":   { "价格": 18500, "吨位": 260 },
    "敞顶箱": { "价格": 19800, "吨位": 275 },
      }
};

// ========== 数据层（localStorage） ==========
let PRICES = {};

function loadPrices() {
  const local = localStorage.getItem("freight_prices");
  if (local) {
    try { PRICES = JSON.parse(local); return; } catch(e) {}
  }
  PRICES = JSON.parse(JSON.stringify(DEFAULT_DATA));
  localStorage.setItem("freight_prices", JSON.stringify(PRICES));
}

function savePrices() {
  localStorage.setItem("freight_prices", JSON.stringify(PRICES));
}

// ========== 查价端 ==========
const input = document.getElementById('searchInput');
const dropdown = document.getElementById('dropdown');
const card = document.getElementById('card');
const hint = document.getElementById('hint');

input.addEventListener('input', function() {
  const val = this.value.trim();
  if (!val) { dropdown.style.display = 'none'; card.classList.remove('show'); hint.style.display='block'; return; }
  const matches = Object.keys(PRICES).filter(k => k.includes(val));
  if (matches.length === 0) { dropdown.style.display = 'none'; return; }
  dropdown.innerHTML = matches.map(k => `<div data-key="${k}">${k}</div>`).join('');
  dropdown.style.display = 'block';
});

document.addEventListener('click', e => { if (!e.target.closest('.search-box')) dropdown.style.display = 'none'; });

dropdown.addEventListener('click', function(e) {
  if (e.target.tagName === 'DIV') {
    input.value = e.target.dataset.key;
    dropdown.style.display = 'none';
    showResult(e.target.dataset.key);
  }
});

function showResult(key) {
  const data = PRICES[key];
  if (!data) return;
  hint.style.display = 'none';
  document.getElementById('cardTitle').textContent = '📍 ' + key;
  document.getElementById('cardBadge').textContent = Object.keys(data).length + '种车型';

  // 找单价最低的
  let bestType = '';
  let bestUnit = Infinity;
  Object.keys(data).forEach(t => {
    const item = data[t];
    const unit = item['价格'] / item['吨位'];
    if (unit < bestUnit) { bestUnit = unit; bestType = t; }
  });

  cardBody.innerHTML = Object.keys(data).map(type => {
    const item = data[type];
    const unit = (item['价格'] / item['吨位']).toFixed(1);
    const cls = type === bestType ? 'row best' : 'row';
    return `
      <div class="${cls}">
        <div>
          <div class="type">${type}</div>
          <div class="detail">吨位：${item['吨位']}吨 | 单价：¥${unit}/吨</div>
        </div>
        <div class="price">¥${Number(item['价格']).toLocaleString('zh-CN')}</div>
      </div>`;
  }).join('');
  card.classList.add('show');
}

// ========== 分享功能 ==========
function copyLink() {
  const url = location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => showToast('✅ 链接已复制')).catch(fallbackCopy);
  } else { fallbackCopy(); }
  function fallbackCopy() {
    const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('✅ 链接已复制');
  }
}

function showQR() {
  const url = encodeURIComponent(location.href);
  document.getElementById('qrcodeImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${url}`;
  document.getElementById('qrModal').classList.add('show');
}
function closeQR() { document.getElementById('qrModal').classList.remove('show'); }

function shareWechat() {
  if (navigator.share) {
    navigator.share({ title: '运费报价查询', url: location.href }).catch(()=>{});
  } else {
    copyLink();
    showToast('📋 链接已复制，去微信粘贴分享');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ========== 管理端登录 ==========
let clickCount = 0;
document.getElementById('adminEntry').addEventListener('click', () => {
  clickCount++;
  if (clickCount >= 5) { clickCount = 0; openPwd(); }
  setTimeout(() => clickCount = 0, 3000);
});

function openPwd() { document.getElementById('pwdModal').classList.add('show'); document.getElementById('pwdInput').focus(); }
function closePwd() { document.getElementById('pwdModal').classList.remove('show'); document.getElementById('pwdInput').value=''; }

function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  if (pwd === ADMIN_PASSWORD) {
    closePwd();
    enterAdmin();
  } else {
    showToast('❌ 密码错误');
    document.getElementById('pwdInput').value = '';
  }
}

// ========== 管理后台 ==========
function enterAdmin() {
  const container = document.getElementById('mainContainer');
  container.innerHTML = `
    <h1>⚙️ 管理后台</h1>
    <p class="subtitle">登录成功，可以管理运费报价数据</p>

    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
      <button onclick="showAddCity()" style="padding:12px 20px;background:#1677ff;color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;">＋ 新增省市</button>
      <button onclick="exportData()" style="padding:12px 20px;background:#52c41a;color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;">⬇️ 导出备份</button>
      <button onclick="document.getElementById('importFile').click()" style="padding:12px 20px;background:#faad14;color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;">⬆️ 导入备份</button>
      <button onclick="resetData()" style="padding:12px 20px;background:#ff4d4f;color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;">🔄 重置数据</button>
      <button onclick="logout()" style="padding:12px 20px;background:#999;color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;">退出</button>
    </div>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">

    <div id="adminList"></div>

    <div style="margin-top:24px;padding:16px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);">
      <h3 style="margin-bottom:12px;color:#333;">📋 操作日志</h3>
      <div id="logList" style="max-height:200px;overflow-y:auto;font-size:13px;color:#666;line-height:1.8;"></div>
    </div>
  `;
  renderAdminList();
  renderLogs();
}

function logout() { location.reload(); }

// 操作日志
function addLog(msg) {
  const logs = JSON.parse(localStorage.getItem('freight_logs') || '[]');
  logs.unshift({ time: new Date().toLocaleString('zh-CN'), msg });
  if (logs.length > 50) logs.length = 50;
  localStorage.setItem('freight_logs', JSON.stringify(logs));
  renderLogs();
}
function renderLogs() {
  const el = document.getElementById('logList');
  if (!el) return;
  const logs = JSON.parse(localStorage.getItem('freight_logs') || '[]');
  el.innerHTML = logs.length ? logs.map(l => `<div>🕐 ${l.time} — ${l.msg}</div>`).join('') : '<div style="color:#bbb;">暂无操作记录</div>';
}

// 管理列表
function renderAdminList() {
  const el = document.getElementById('adminList');
  if (!el) return;
  const cities = Object.keys(PRICES);
  el.innerHTML = cities.length ? cities.map(city => `
    <div style="background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <strong style="font-size:16px;">📍 ${city}</strong>
        <div style="display:flex;gap:8px;">
          <button onclick="editCity('${city}')" style="padding:6px 14px;background:#e6f4ff;color:#1677ff;border:none;border-radius:6px;cursor:pointer;font-size:13px;">✏️ 编辑</button>
          <button onclick="deleteCity('${city}')" style="padding:6px 14px;background:#fff1f0;color:#ff4d4f;border:none;border-radius:6px;cursor:pointer;font-size:13px;">🗑️ 删除</button>
        </div>
      </div>
      <div style="font-size:13px;color:#999;">
        ${Object.keys(PRICES[city]).map(t => `<span style="display:inline-block;margin-right:12px;margin-bottom:4px;">${t}: ¥${Number(PRICES[city][t]['价格']).toLocaleString()} / ${PRICES[city][t]['吨位']}吨</span>`).join('')}
      </div>
    </div>
  `).join('') : '<div style="text-align:center;color:#bbb;padding:40px;">暂无数据，点击"新增省市"开始录入</div>';
}

// 新增省市
function showAddCity() {
  document.getElementById('editTitle').textContent = '＋ 新增省市';
  document.getElementById('editCity').value = '';
  document.getElementById('editTypes').innerHTML = createTypeRow();
  document.getElementById('editModal').classList.add('show');
  window._editingCity = null;
}

// 编辑省市
function editCity(city) {
  document.getElementById('editTitle').textContent = '✏️ 编辑：' + city;
  document.getElementById('editCity').value = city;
  const types = PRICES[city];
  document.getElementById('editTypes').innerHTML = Object.keys(types).map(t => createTypeRow(t, types[t]['价格'], types[t]['吨位'])).join('');
  document.getElementById('editModal').classList.add('show');
  window._editingCity = city;
}

function createTypeRow(typeVal='', priceVal='', tonVal='') {
  return `
    <div style="margin-bottom:8px;border:1px solid #f0f0f0;padding:10px;border-radius:8px;background:#fafafa;">
      <input type="text" class="et-type" value="${typeVal}" placeholder="车型（如：整车）" style="margin-bottom:6px;width:100%;padding:10px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;">
      <input type="number" class="et-price" value="${priceVal}" placeholder="价格（元）" style="margin-bottom:6px;width:100%;padding:10px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;">
      <input type="number" class="et-ton" value="${tonVal}" placeholder="吨位" style="width:100%;padding:10px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;">
    </div>
  `;
}

function addTypeRow() {
  const div = document.createElement('div');
  div.innerHTML = createTypeRow();
  document.getElementById('editTypes').appendChild(div);
}

function closeEdit() { document.getElementById('editModal').classList.remove('show'); }

function saveEdit() {
  const city = document.getElementById('editCity').value.trim();
  if (!city) { showToast('❌ 请输入省市名称'); return; }

  const types = {};
  const rows = document.getElementById('editTypes').children;
  for (let row of rows) {
    const t = row.querySelector('.et-type').value.trim();
    const p = parseFloat(row.querySelector('.et-price').value);
    const n = parseFloat(row.querySelector('.et-ton').value);
    if (t && p && n) types[t] = { '价格': p, '吨位': n };
  }
  if (Object.keys(types).length === 0) { showToast('❌ 请至少填写一种车型'); return; }

  if (window._editingCity && window._editingCity !== city) {
    delete PRICES[window._editingCity];
    addLog(`修改省市名：${window._editingCity} → ${city}`);
  } else {
    addLog(window._editingCity ? `编辑：${city}` : `新增：${city}`);
  }

  PRICES[city] = types;
  savePrices();
  closeEdit();
  renderAdminList();
  showToast('✅ 保存成功');
}

function deleteCity(city) {
  if (!confirm(`确定删除「${city}」的报价数据吗？`)) return;
  delete PRICES[city];
  savePrices();
  addLog(`删除：${city}`);
  renderAdminList();
  showToast('✅ 已删除');
}

// 导出
function exportData() {
  const data = JSON.stringify(PRICES, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `运费报价备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  addLog('导出数据备份');
  showToast('✅ 导出成功');
}

// 导入
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      PRICES = data;
      savePrices();
      renderAdminList();
      addLog('导入数据备份');
      showToast('✅ 导入成功');
    } catch(err) {
      showToast('❌ 文件格式错误');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// 重置
function resetData() {
  if (!confirm('确定恢复为默认示例数据吗？当前数据会被覆盖！')) return;
  PRICES = JSON.parse(JSON.stringify(DEFAULT_DATA));
  savePrices();
  renderAdminList();
  addLog('重置为默认数据');
  showToast('✅ 已重置');
}

// ========== 初始化 ==========
loadPrices();
</script>
</body>
</html>
