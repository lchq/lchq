<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>运费报价查询</title>
<style>
:root {
  --primary: #1677ff;
  --primary-light: #e6f4ff;
  --danger: #ff4d4f;
  --success: #52c41a;
  --warning: #faad14;
  --bg: #f0f2f5;
  --card: #ffffff;
  --text: #1a1a1a;
  --text-secondary: #666666;
  --text-tertiary: #999999;
  --border: #e8e8e8;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 20px rgba(0,0,0,0.12);
  --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  padding: 16px;
  min-height: 100vh;
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
}
.container { max-width: 560px; margin: 0 auto; }

/* Header */
.header { text-align: center; margin: 12px 0 24px; }
.header h1 { font-size: 24px; color: var(--text); margin-bottom: 6px; }
.header p { font-size: 13px; color: var(--text-tertiary); }

/* Search */
.search-box { position: relative; margin-bottom: 16px; }
.search-box .input-wrap { position: relative; }
.search-box input {
  width: 100%; padding: 15px 44px 15px 18px; font-size: 16px;
  border: 2px solid var(--border); border-radius: var(--radius);
  outline: none; transition: border-color .2s, box-shadow .2s;
  background: var(--card); color: var(--text);
}
.search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22,119,255,0.1); }
.search-box input::placeholder { color: #bbb; }
.clear-btn {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  width: 22px; height: 22px; border: none; border-radius: 50%;
  background: #ddd; color: #fff; font-size: 14px; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  line-height: 1;
}
.clear-btn.show { display: flex; }
.clear-btn:active { background: #bbb; }
.dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); max-height: 240px; overflow-y: auto;
  display: none; z-index: 100; padding: 6px;
}
.dropdown.show { display: block; }
.dropdown div {
  padding: 12px 14px; cursor: pointer; font-size: 15px;
  border-radius: 8px; transition: background .15s;
}
.dropdown div:hover, .dropdown div.active { background: var(--primary-light); color: var(--primary); }

/* Card */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); display: none; overflow: hidden; animation: slideUp .3s ease; }
.card.show { display: block; }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.card-header { background: linear-gradient(135deg, var(--primary), #4096ff); color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
.card-header h2 { font-size: 18px; font-weight: 600; }
.card-header .count { font-size: 13px; opacity: .8; }
.card-body { padding: 4px 0; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #f5f5f5; transition: background .15s; }
.row:last-child { border-bottom: none; }
.row:active { background: #fafafa; }
.row .left { display: flex; flex-direction: column; gap: 4px; }
.row .type { font-size: 15px; font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 6px; }
.row .detail { font-size: 12px; color: var(--text-tertiary); }
.row .price { font-size: 20px; font-weight: 700; color: var(--danger); }
.row .unit-price { font-size: 11px; color: var(--text-tertiary); text-align: right; margin-top: 2px; }
.star { color: var(--warning); font-size: 14px; }

/* Share bar */
.share-bar { display: flex; gap: 10px; margin-top: 16px; }
.share-bar button {
  flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--card); font-size: 14px; cursor: pointer; color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .2s;
}
.share-bar button:active { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

/* Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.45); z-index: 1000; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--card); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; animation: zoomIn .25s; }
@keyframes zoomIn { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal h3 { margin-bottom: 16px; font-size: 17px; text-align: center; }
.modal input {
  width: 100%; padding: 12px 14px; font-size: 15px; border: 1.5px solid var(--border);
  border-radius: 10px; outline: none; margin-bottom: 12px; transition: border-color .2s;
}
.modal input:focus { border-color: var(--primary); }
.modal-actions { display: flex; gap: 10px; margin-top: 8px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; cursor: pointer; border: none; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:active { background: #0958d8; }
.btn-cancel { background: #f5f5f5; color: var(--text-secondary); }
.btn-cancel:active { background: #e8e8e8; }

/* QR */
.qr-wrap { text-align: center; padding: 10px 0; }
.qr-wrap img { width: 200px; height: 200px; border: 1px solid var(--border); border-radius: 10px; }
.qr-wrap p { font-size: 13px; color: var(--text-tertiary); margin-top: 10px; word-break: break-all; }
.qr-fallback { width: 200px; height: 200px; border: 2px dashed var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 14px; margin: 0 auto; }

/* Toast */
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 2000; display: none; }
.toast.show { display: block; animation: fadeIn .2s; }

/* Empty */
.empty { text-align: center; padding: 48px 20px; color: var(--text-tertiary); }
.empty .icon { font-size: 40px; margin-bottom: 12px; }
.empty p { font-size: 14px; line-height: 1.6; }

/* Footer */
.footer { text-align: center; margin-top: 32px; padding-bottom: 20px; }
.footer .version { font-size: 12px; color: #ccc; cursor: pointer; user-select: none; }

/* ===== ADMIN PANEL ===== */
.admin-panel { display: none; margin-top: 20px; }
.admin-panel.show { display: block; }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.admin-header h2 { font-size: 18px; color: var(--primary); }
.admin-header .admin-actions { display: flex; gap: 8px; }
.admin-header button { padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; }
.btn-add { background: var(--primary); color: #fff; }
.btn-export { background: #f5f5f5; color: var(--text); }
.btn-import { background: #f5f5f5; color: var(--text); }
.btn-reset { background: #fff2f0; color: var(--danger); border: 1px solid #ffccc7 !important; }
.btn-logout { background: #f5f5f5; color: var(--text-secondary); }

.admin-list { display: flex; flex-direction: column; gap: 10px; }
.admin-item { background: var(--card); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; }
.admin-item .info { flex: 1; }
.admin-item .info .name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.admin-item .info .types { font-size: 12px; color: var(--text-tertiary); }
.admin-item .actions { display: flex; gap: 6px; }
.admin-item .actions button { padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: #fff; }
.admin-item .actions .edit-btn { color: var(--primary); border-color: #91caff; }
.admin-item .actions .del-btn { color: var(--danger); border-color: #ffccc7; }

/* Edit form */
.edit-form { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; display: none; }
.edit-form.show { display: block; }
.edit-form h3 { margin-bottom: 14px; font-size: 16px; }
.edit-form label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; margin-top: 10px; }
.edit-form input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1.5px solid var(--border); border-radius: 8px; outline: none; }
.edit-form input:focus { border-color: var(--primary); }
.edit-form .type-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
.edit-form .type-row input { flex: 1; }
.edit-form .type-row button { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--danger); background: #fff; color: var(--danger); cursor: pointer; white-space: nowrap; }
.edit-form .form-actions { display: flex; gap: 10px; margin-top: 16px; }
.edit-form .form-actions button { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; }
.form-save { background: var(--primary); color: #fff; }
.form-cancel { background: #f5f5f5; color: var(--text-secondary); }

/* Log */
.log-box { background: #1e1e1e; border-radius: 10px; padding: 14px; margin-top: 16px; max-height: 160px; overflow-y: auto; }
.log-box .log-title { color: #aaa; font-size: 12px; margin-bottom: 8px; }
.log-box .log-item { color: #4af626; font-size: 12px; font-family: monospace; line-height: 1.8; }

/* File input hidden */
.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🚂 运费报价查询</h1>
    <p>输入目的地，秒查各车型报价</p>
  </div>

  <!-- Search -->
  <div class="search-box">
    <div class="input-wrap">
      <input type="text" id="searchInput" placeholder="输入省市名称，如：北京" autocomplete="off">
      <button class="clear-btn" id="clearBtn">✕</button>
    </div>
    <div class="dropdown" id="dropdown"></div>
  </div>

  <!-- Result Card -->
  <div class="card" id="card">
    <div class="card-header">
      <h2 id="cardTitle"></h2>
      <span class="count" id="cardCount"></span>
    </div>
    <div class="card-body" id="cardBody"></div>
  </div>

  <!-- Share Bar -->
  <div class="share-bar" id="shareBar" style="display:none;">
    <button id="btnCopy">📋 复制链接</button>
    <button id="btnQR">🔗 二维码</button>
    <button id="btnWechat">💬 微信转发</button>
  </div>

  <!-- Empty / Hint -->
  <div class="empty" id="emptyHint">
    <div class="icon">💡</div>
    <p>输入省市名称开始查询<br>支持模糊搜索，如"新疆""内蒙古"</p>
  </div>

  <!-- Admin Panel -->
  <div class="admin-panel" id="adminPanel">
    <div class="admin-header">
      <h2>⚙️ 管理后台</h2>
      <div class="admin-actions">
        <button class="btn-add" id="btnAdd">＋ 新增省市</button>
        <button class="btn-export" id="btnExport">⬇️ 导出</button>
        <button class="btn-import" id="btnImport">⬆️ 导入</button>
        <button class="btn-reset" id="btnReset">🔄 重置</button>
        <button class="btn-logout" id="btnLogout">退出</button>
      </div>
    </div>

    <!-- Edit Form -->
    <div class="edit-form" id="editForm">
      <h3 id="formTitle">新增省市</h3>
      <label>省市名称</label>
      <input type="text" id="formName" placeholder="如：北京">
      <div id="formTypes"></div>
      <button type="button" id="btnAddType" style="margin-top:12px;padding:8px 14px;border:1px dashed #91caff;background:#f0f8ff;color:#1677ff;border-radius:8px;cursor:pointer;font-size:13px;">＋ 添加车型</button>
      <div class="form-actions">
        <button class="form-cancel" id="formCancel">取消</button>
        <button class="form-save" id="formSave">保存</button>
      </div>
    </div>

    <div class="admin-list" id="adminList"></div>

    <div class="log-box">
      <div class="log-title">📋 操作日志</div>
      <div class="log-item" id="logList">暂无操作记录</div>
    </div>
  </div>

  <div class="footer">
    <span class="version" id="versionTag" title="连点5次进入管理端">v5.1 🚂</span>
  </div>
</div>

<!-- QR Modal -->
<div class="modal-overlay" id="qrModal">
  <div class="modal">
    <h3>📱 扫码访问</h3>
    <div class="qr-wrap" id="qrWrap"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="qrClose">关闭</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Hidden file input -->
<input type="file" id="fileInput" class="hidden" accept=".json">

<script>
// ===== CONFIG =====
const ADMIN_PASSWORD = "admin123";
const STORAGE_KEY = "freight_prices_v5";
const LOG_KEY = "freight_logs_v5";

const DEFAULT_DATA = {
  "北京": {
    "整车":   { "价格": 13496, "吨位": 225 },
    "敞顶箱": { "价格": 14882.6, "吨位": 241 }
  },
  "上海": {
    "整车":   { "价格": 12800, "吨位": 210 },
    "敞顶箱": { "价格": 14000, "吨位": 230 }
  },
  "广东": {
    "整车":   { "价格": 9800, "吨位": 180 },
    "敞顶箱": { "价格": 11200, "吨位": 200 }
  },
  "浙江": {
    "整车":   { "价格": 10500, "吨位": 195 },
    "敞顶箱": { "价格": 11800, "吨位": 215 }
  },
  "江苏": {
    "整车":   { "价格": 10200, "吨位": 190 },
    "敞顶箱": { "价格": 11500, "吨位": 210 }
  },
  "四川": {
    "整车":   { "价格": 12500, "吨位": 220 },
    "敞顶箱": { "价格": 13800, "吨位": 240 }
  },
  "新疆": {
    "整车":   { "价格": 18500, "吨位": 260 },
    "敞顶箱": { "价格": 19800, "吨位": 275 }
  },
  "西藏": {
    "整车":   { "价格": 22000, "吨位": 280 },
    "敞顶箱": { "价格": 23500, "吨位": 295 }
  }
};

// ===== STATE =====
let prices = {};
let logs = [];
let adminMode = false;
let editKey = null; // null=add, string=edit existing key
let dropdownIndex = -1;

// ===== INIT =====
function init() {
  loadData();
  loadLogs();
  renderAdminList();
  bindEvents();
}

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    prices = saved ? JSON.parse(saved) : { ...DEFAULT_DATA };
  } catch { prices = { ...DEFAULT_DATA }; }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(prices));
}

function loadLogs() {
  try {
    const saved = localStorage.getItem(LOG_KEY);
    logs = saved ? JSON.parse(saved) : [];
  } catch { logs = []; }
  renderLogs();
}

function addLog(msg) {
  const time = new Date().toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  logs.unshift(`[${time}] ${msg}`);
  if (logs.length > 50) logs = logs.slice(0, 50);
  localStorage.setItem(LOG_KEY, JSON.stringify(logs));
  renderLogs();
}

function renderLogs() {
  const el = document.getElementById('logList');
  el.innerHTML = logs.length ? logs.join('<br>') : '暂无操作记录';
}

// ===== EVENTS =====
function bindEvents() {
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const dropdown = document.getElementById('dropdown');

  input.addEventListener('input', onInput);
  input.addEventListener('keydown', onKeydown);
  clearBtn.addEventListener('click', () => { input.value=''; clearBtn.classList.remove('show'); document.getElementById('card').classList.remove('show'); document.getElementById('shareBar').style.display='none'; document.getElementById('emptyHint').style.display='block'; dropdown.classList.remove('show'); });

  // Click outside
  document.addEventListener('click', e => { if (!e.target.closest('.search-box')) dropdown.classList.remove('show'); });

  // Share buttons
  document.getElementById('btnCopy').addEventListener('click', copyLink);
  document.getElementById('btnQR').addEventListener('click', showQR);
  document.getElementById('qrClose').addEventListener('click', () => document.getElementById('qrModal').classList.remove('show'));
  document.getElementById('btnWechat').addEventListener('click', wechatShare);

  // Admin
  document.getElementById('versionTag').addEventListener('click', onVersionClick);
  document.getElementById('btnAdd').addEventListener('click', () => openForm(null));
  document.getElementById('btnExport').addEventListener('click', exportData);
  document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', importData);
  document.getElementById('btnReset').addEventListener('click', resetData);
  document.getElementById('btnLogout').addEventListener('click', () => { adminMode=false; document.getElementById('adminPanel').classList.remove('show'); });

  document.getElementById('formCancel').addEventListener('click', () => document.getElementById('editForm').classList.remove('show'));
  document.getElementById('formSave').addEventListener('click', saveForm);
  document.getElementById('btnAddType').addEventListener('click', addTypeRow);
}

// Version click → admin
let clickCount = 0, clickTimer = null;
function onVersionClick() {
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => clickCount = 0, 2000);
  if (clickCount >= 5) { clickCount = 0; promptPassword(); }
}

function promptPassword() {
  const pw = prompt('请输入管理密码：', '');
  if (pw === ADMIN_PASSWORD) {
    adminMode = true;
    document.getElementById('adminPanel').classList.add('show');
    showToast('✅ 已进入管理后台');
  } else if (pw !== null) {
    showToast('❌ 密码错误');
  }
}

// ===== SEARCH (input-as-you-type, auto show) =====
function onInput() {
  const val = this.value.trim();
  const clearBtn = document.getElementById('clearBtn');
  const dropdown = document.getElementById('dropdown');
  const card = document.getElementById('card');
  const shareBar = document.getElementById('shareBar');
  const hint = document.getElementById('emptyHint');

  if (!val) { clearBtn.classList.remove('show'); dropdown.classList.remove('show'); card.classList.remove('show'); shareBar.style.display='none'; hint.style.display='block'; return; }
  clearBtn.classList.add('show');
  dropdownIndex = -1;

  const matches = Object.keys(prices).filter(k => k.includes(val));
  hint.style.display = 'none';

  if (matches.length === 0) {
    dropdown.classList.remove('show');
    card.classList.remove('show');
    shareBar.style.display = 'none';
    hint.style.display = 'block';
    hint.innerHTML = '<div class="icon">🤔</div><p>未找到该目的地的报价<br>请检查输入是否正确</p>';
    return;
  }

  // Show dropdown
  dropdown.innerHTML = matches.map((k, i) => `<div data-key="${k}" data-i="${i}">🚂 ${k}</div>`).join('');
  dropdown.classList.add('show');

  // Auto-show if exact match or single result
  const exact = matches.find(k => k === val);
  if (exact) {
    showResult(exact);
    dropdown.classList.remove('show');
  } else if (matches.length === 1) {
    showResult(matches[0]);
    dropdown.classList.remove('show');
  } else {
    card.classList.remove('show');
    shareBar.style.display = 'none';
  }

  // Bind dropdown clicks
  dropdown.querySelectorAll('div').forEach(div => {
    div.addEventListener('click', () => { showResult(div.dataset.key); dropdown.classList.remove('show'); });
  });
}

function onKeydown(e) {
  const dropdown = document.getElementById('dropdown');
  const items = dropdown.querySelectorAll('div');
  if (!dropdown.classList.contains('show') || !items.length) return;

  if (e.key === 'ArrowDown') { e.preventDefault(); dropdownIndex = (dropdownIndex+1) % items.length; updateActive(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); dropdownIndex = (dropdownIndex-1+items.length) % items.length; updateActive(items); }
  else if (e.key === 'Enter') { e.preventDefault(); if (dropdownIndex>=0) { showResult(items[dropdownIndex].dataset.key); dropdown.classList.remove('show'); } }
  else if (e.key === 'Escape') { dropdown.classList.remove('show'); }
}

function updateActive(items) {
  items.forEach((el, i) => el.classList.toggle('active', i === dropdownIndex));
  if (items[dropdownIndex]) items[dropdownIndex].scrollIntoView({ block: 'nearest' });
}

// ===== SHOW RESULT =====
function showResult(key) {
  const data = prices[key];
  if (!data) return;
  const card = document.getElementById('card');
  const title = document.getElementById('cardTitle');
  const count = document.getElementById('cardCount');
  const body = document.getElementById('cardBody');
  const shareBar = document.getElementById('shareBar');
  const hint = document.getElementById('emptyHint');

  // Find lowest unit price
  let minUnit = Infinity, minType = '';
  Object.keys(data).forEach(t => { const u = data[t]['价格']/data[t]['吨位']; if (u < minUnit) { minUnit = u; minType = t; } });

  title.textContent = `🚂 ${key}`;
  count.textContent = `${Object.keys(data).length} 种车型`;
  body.innerHTML = Object.keys(data).map(t => {
    const item = data[t];
    const unit = (item['价格']/item['吨位']).toFixed(2);
    const star = t === minType ? '<span class="star">⭐</span> ' : '';
    return `<div class="row">
      <div class="left">
        <div class="type">${star}${t}</div>
        <div class="detail">吨位：${item['吨位']} 吨 · 单价：¥${unit}/吨</div>
      </div>
      <div style="text-align:right;">
        <div class="price">¥${formatNum(item['价格'])}</div>
        ${t===minType ? '<div class="unit-price" style="color:#faad14;">最低单价</div>' : ''}
      </div>
    </div>`;
  }).join('');

  card.classList.add('show');
  shareBar.style.display = 'flex';
  hint.style.display = 'none';
  document.getElementById('searchInput').value = key;
  document.getElementById('clearBtn').classList.add('show');
}

function formatNum(n) { return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 1 }); }

// ===== SHARE =====
function copyLink() {
  const url = location.href;
  if (navigator.clipboard) { navigator.clipboard.writeText(url).then(()=>showToast('✅ 链接已复制')).catch(()=>fallbackCopy(url)); }
  else fallbackCopy(url);
}
function fallbackCopy(t) { const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✅ 链接已复制'); }

function showQR() {
  const url = encodeURIComponent(location.href);
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${url}`;
  const wrap = document.getElementById('qrWrap');
  wrap.innerHTML = `<img src="${qrUrl}" alt="二维码" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="qr-fallback" style="display:none;">二维码加载中...</div><p>${location.href}</p>`;
  document.getElementById('qrModal').classList.add('show');
}

function wechatShare() {
  if (navigator.share) { navigator.share({ title:'运费报价查询', url:location.href }).catch(()=>{}); }
  else { copyLink(); showToast('请粘贴链接到微信发送'); }
}

// ===== ADMIN: LIST =====
function renderAdminList() {
  const list = document.getElementById('adminList');
  const keys = Object.keys(prices).sort();
  list.innerHTML = keys.length ? keys.map(k => {
    const types = Object.keys(prices[k]).join(' / ');
    return `<div class="admin-item">
      <div class="info">
        <div class="name">🚂 ${k}</div>
        <div class="types">${types}</div>
      </div>
      <div class="actions">
        <button class="edit-btn" onclick="openForm('${k}')">✏️ 编辑</button>
        <button class="del-btn" onclick="deleteItem('${k}')">🗑️ 删除</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty"><p>暂无数据，点击"新增省市"开始录入</p></div>';
}

function deleteItem(key) {
  if (!confirm(`确定删除「${key}」吗？`)) return;
  delete prices[key];
  saveData();
  addLog(`删除省市：${key}`);
  renderAdminList();
  showToast(`已删除「${key}」`);
}

// ===== ADMIN: FORM =====
function openForm(key) {
  editKey = key;
  const form = document.getElementById('editForm');
  const title = document.getElementById('formTitle');
  const nameInput = document.getElementById('formName');
  const typesDiv = document.getElementById('formTypes');

  form.classList.add('show');
  if (key) {
    title.textContent = `编辑：${key}`;
    nameInput.value = key;
    const data = prices[key];
    typesDiv.innerHTML = '';
    Object.keys(data).forEach(t => addTypeRow(t, data[t]['价格'], data[t]['吨位']));
  } else {
    title.textContent = '新增省市';
    nameInput.value = '';
    typesDiv.innerHTML = '';
    addTypeRow('', '', '');
  }
}

function addTypeRow(name='', price='', ton='') {
  const div = document.getElementById('formTypes');
  const row = document.createElement('div');
  row.className = 'type-row';
  row.innerHTML = `<input placeholder="车型名称（如：整车）" value="${name}" class="t-name">
    <input placeholder="价格" type="number" step="0.1" value="${price}" class="t-price" style="max-width:110px;">
    <input placeholder="吨位" type="number" value="${ton}" class="t-ton" style="max-width:90px;">
    <button type="button" onclick="this.parentElement.remove()">删除</button>`;
  div.appendChild(row);
}

function saveForm() {
  const name = document.getElementById('formName').value.trim();
  if (!name) return showToast('请输入省市名称');

  const rows = document.querySelectorAll('#formTypes .type-row');
  if (!rows.length) return showToast('请至少添加一个车型');

  const data = {};
  for (const row of rows) {
    const tname = row.querySelector('.t-name').value.trim();
    const tprice = parseFloat(row.querySelector('.t-price').value);
    const tton = parseFloat(row.querySelector('.t-ton').value);
    if (!tname) return showToast('车型名称不能为空');
    if (isNaN(tprice) || isNaN(tton)) return showToast(`「${tname}」价格或吨位无效`);
    data[tname] = { '价格': tprice, '吨位': tton };
  }

  const isEdit = editKey !== null;
  if (isEdit && editKey !== name) delete prices[editKey];
  prices[name] = data;
  saveData();
  addLog(`${isEdit?'编辑':'新增'}省市：${name}（${Object.keys(data).join('/')}）`);
  renderAdminList();
  document.getElementById('editForm').classList.remove('show');
  showToast(`✅ 已${isEdit?'更新':'新增'}「${name}」`);
}

// ===== ADMIN: EXPORT / IMPORT / RESET =====
function exportData() {
  const data = JSON.stringify(prices, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `运费报价备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  addLog('导出备份数据');
  showToast('✅ 备份已下载');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      prices = data;
      saveData();
      addLog(`导入备份数据（${Object.keys(data).length}条）`);
      renderAdminList();
      showToast('✅ 导入成功');
    } catch { showToast('❌ 文件格式错误'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function resetData() {
  if (!confirm('确定恢复为默认示例数据吗？当前数据会被覆盖！')) return;
  prices = { ...DEFAULT_DATA };
  saveData();
  addLog('重置为默认数据');
  renderAdminList();
  showToast('✅ 已恢复默认数据');
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== START =====
init();
</script>
</body>
</html>
